---
layout: default
---
{% assign words = content | number_of_words %}
<article class="post">
  <header class="post-head">
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="dek">{{ page.description | smartify }}</p>{% endif %}
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time> <span aria-hidden="true">/</span> {{ words | divided_by: 230 | plus: 1 }} min read</p>
  </header>
  <div class="prose">
{{ content }}
  </div>
  <p class="back"><a href="{{ '/' | relative_url }}">More writing</a></p>
</article>
